name: publish-pypi

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref or release tag to build and publish
        required: false
        default: main

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/faster-mac-use/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref || 'main' }}

      - uses: astral-sh/setup-uv@v5

      - name: Build clean sdist and wheel
        run: uv build

      - name: Publish distributions with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
